name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if the tag already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  ROKIT_VERSION: "1.2.0"

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest

    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read the version and look for its tag
        id: version
        run: |
          VERSION=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' pesde.toml | head -1)

          if [ -z "$VERSION" ]; then
            echo "could not read a version from pesde.toml" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already exists, nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION is new"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    needs: check
    if: needs.check.outputs.release == 'true' || inputs.force
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rokit
        run: |
          curl -sL -o "$RUNNER_TEMP/rokit.zip" \
            "https://github.com/rojo-rbx/rokit/releases/download/v${ROKIT_VERSION}/rokit-${ROKIT_VERSION}-linux-x86_64.zip"
          unzip -o -q "$RUNNER_TEMP/rokit.zip" -d "$RUNNER_TEMP/rokit"
          echo "$RUNNER_TEMP/rokit" >> "$GITHUB_PATH"

      - name: Install tools
        run: |
          rokit install --no-trust-check
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pesde install

      - name: Check version and manifest drift
        run: pesde run verify

      - name: Typecheck
        run: pesde run analyze

      - name: Build model file
        run: pesde run build

      - name: Verify the model file exists
        run: test -s build/SentryRoblox.rbxm

      - name: Build example place
        run: pesde run example

      - name: Verify the example place exists
        run: test -s example/SentryExample.rbxl

      - name: Extract the release notes from the changelog
        env:
          TAG: v${{ needs.check.outputs.version }}
        run: pesde run changelog -- "$TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Tag and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.check.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" build/SentryRoblox.rbxm example/SentryExample.rbxl --clobber

      - name: Publish to pesde
        env:
          PESDE_TOKEN: ${{ secrets.PESDE_TOKEN }}
        run: |
          pesde auth login --token "$PESDE_TOKEN"
          pesde publish --yes

      - name: Publish to Wally
        env:
          WALLY_AUTH: ${{ secrets.WALLY_AUTH }}
        run: |
          wally login --token "$WALLY_AUTH"

          if ! OUTPUT=$(wally publish 2>&1); then
            echo "$OUTPUT"
            echo "::error::wally publish failed, nothing was published to Wally"
            exit 1
          fi

          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -q '^Error:'; then
            echo "::error::wally publish printed an error and exited zero, nothing was published to Wally"
            exit 1
          fi
